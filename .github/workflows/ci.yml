name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: liblemma
      run_tests: true
      publish_to: "deb,apk,rpm,pacman,brew,openbsd,winget"
      deps: "libcorm"
      deps_pacman: "libstele,libcorm"
      deps_winget_tty: "libstele,libcorm"
    secrets: inherit
